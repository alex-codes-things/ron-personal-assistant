[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ron-personal-assistant"
version = "0.13.1"
description = "A hybrid cloud/local personal assistant built in Python."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "AlexCodesThings" }
]
dependencies = [
    "prompt-toolkit>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
desktop-preview = [
    "PySide6>=6.8,<7",
]
voice = [
    "faster-whisper>=1.1,<2",
    "numpy>=1.26,<3",
    "sherpa-onnx>=1.10,<2",
    "sounddevice>=0.5,<1",
    "kokoro-onnx>=0.6.1,<0.7",
    "winsdk>=1.0.0b10,<2; sys_platform == 'win32'",
]

[project.scripts]
ron = "ron.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
